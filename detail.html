<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP Orders - Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    :root {
      --bg:#f5f7fa; --surface:#fff; --surface-2:#f0f3f8; --text:#17212e; --muted:#607086; --border:#d9e1ec; --accent:#0a6ed1;
    }
    html[data-theme="dark"] {
      --bg:#0f141b; --surface:#161d27; --surface-2:#1e2835; --text:#e4ebf5; --muted:#9bb0c7; --border:#2d3b4d; --accent:#4da3ff;
    }
    body { margin:0; font:13px/1.3 "Inter","Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    .topbar { height:48px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--border); }
    .brand { font-weight:700; margin-right:auto; }
    .wrap { margin:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
    .head { padding:8px 10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .body { padding:10px; display:grid; gap:10px; }
    fieldset { border:1px solid var(--border); border-radius:8px; padding:8px; margin:0; }
    legend { padding:0 4px; font-size:11px; color:var(--muted); text-transform:uppercase; }
    .preview-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:8px; }
    .pv { background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:6px 8px; min-height:52px; }
    .pv .k { font-size:11px; color:var(--muted); text-transform:uppercase; }
    .pv .v { margin-top:3px; font-size:13px; }
    .full { grid-column:1/-1; }
    .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); }
    .tab { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--text); padding:6px 8px; }
    .tab.active { border-bottom-color: var(--accent); color:var(--accent); font-weight:600; }
    .tab-panel { display:none; padding-top:8px; }
    .tab-panel.active { display:block; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:6px 8px; border-bottom:1px solid var(--border); }
    .readonly .edit-only { display:none; }
    .edit-mode .preview-only { display:none; }
    .form-floating > .form-control,
    .form-floating > .form-select { min-height: 42px; height:42px; font-size:13px; background:var(--surface); color:var(--text); border-color:var(--border); }
    .form-floating > label { color:var(--muted); font-size:12px; }
    .form-control, .form-select { background:var(--surface); color:var(--text); border-color:var(--border); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn btn-sm btn-outline-secondary" href="index.html">← List</a>
    <div class="brand" id="detailTitle">Order Detail</div>
    <button id="themeToggle" class="btn btn-sm btn-outline-secondary">🌗 Theme</button>
    <button id="editToggle" class="btn btn-sm btn-primary">Edit</button>
  </header>

  <section class="wrap readonly" id="detailRoot">
    <div class="head"><span id="modePill">Preview</span><small class="text-secondary">Preview mode uses plain text (no inputs)</small></div>
    <div class="body">
      <fieldset class="preview-only">
        <legend>Main</legend>
        <div class="preview-grid" id="previewGrid"></div>
      </fieldset>

      <fieldset class="edit-only">
        <legend>Main (Edit)</legend>
        <div class="row g-2">
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="orderNo" type="text" placeholder="Order number">
              <label for="orderNo">Order number</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="customer" list="customerList" placeholder="Customer">
              <label for="customer">Customer (lookup)</label>
              <datalist id="customerList"><option>ACME Corp</option><option>Northwind</option><option>Globex</option></datalist>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" id="status"><option>Open</option><option>Closed</option></select>
              <label for="status">Status</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="amount" type="number" step="0.01" placeholder="Amount">
              <label for="amount">Amount</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" id="orderDate" type="date" placeholder="Date">
              <label for="orderDate">Date</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" id="deliveryTime" type="time" placeholder="Time">
              <label for="deliveryTime">Time</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" id="appointment" type="datetime-local" placeholder="DateTime">
              <label for="appointment">DateTime</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-floating">
              <textarea class="form-control" id="note" style="height:72px" placeholder="Note"></textarea>
              <label for="note">Note</label>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Tabs</legend>
        <div class="tabs">
          <button class="tab active" data-tab="items">Items</button>
          <button class="tab" data-tab="shipping">Shipping</button>
        </div>

        <div id="tab-items" class="tab-panel active">
          <div class="preview-only">
            <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Line Total</th></tr></thead><tbody id="itemsPreviewBody"></tbody></table>
          </div>
          <div class="edit-only">
            <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Line Total</th></tr></thead><tbody id="itemsEditBody"></tbody></table>
          </div>
        </div>

        <div id="tab-shipping" class="tab-panel">
          <div class="preview-only" id="shippingPreview"></div>
          <div class="edit-only row g-2">
            <div class="col-md-6"><div class="form-floating"><select class="form-select" id="warehouse"><option>WH-01</option><option>WH-02</option></select><label for="warehouse">Warehouse</label></div></div>
            <div class="col-md-6"><div class="form-floating"><input class="form-control" id="carrier" type="text" value="DHL" placeholder="Carrier"><label for="carrier">Carrier</label></div></div>
            <div class="col-12"><div class="form-floating"><textarea class="form-control" id="address" style="height:72px" placeholder="Address">Main street 1</textarea><label for="address">Address</label></div></div>
          </div>
        </div>
      </fieldset>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get('id') || 1);
    const customers = ['ACME Corp', 'Northwind', 'Globex', 'Initech', 'Umbrella', 'Soylent', 'Hooli'];
    const day = String((id % 28) + 1).padStart(2, '0');
    const order = {
      id,
      no: `SO-${String(id).padStart(5, '0')}`,
      date: `2026-03-${day}`,
      customer: customers[id % customers.length],
      status: id % 3 === 0 ? 'Closed' : 'Open',
      amount: +(id * 7.13 % 2000 + 100).toFixed(2),
      note: 'Compact ERP demo order.',
      deliveryTime: '10:30',
      appointment: `2026-03-${day}T10:30`,
      shipping: { warehouse: 'WH-01', carrier: 'DHL', address: 'Main street 1' },
      items: [{product:'Widget A', qty:1+(id%4), price:19.9},{product:'Widget B', qty:2+(id%3), price:12.5}]
    };

    document.getElementById('detailTitle').textContent = `Order Detail · ${order.no}`;

    function renderPreview() {
      const pv = document.getElementById('previewGrid');
      const fields = [
        ['Order number', order.no], ['Customer', order.customer], ['Status', order.status], ['Amount', order.amount.toFixed(2)],
        ['Date', order.date], ['Time', order.deliveryTime], ['DateTime', order.appointment], ['Note', order.note, true]
      ];
      pv.innerHTML = fields.map(([k,v,full]) => `<div class="pv ${full?'full':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

      const pBody = document.getElementById('itemsPreviewBody');
      pBody.innerHTML = order.items.map(it => `<tr><td>${it.product}</td><td>${it.qty}</td><td>${it.price.toFixed(2)}</td><td>${(it.qty*it.price).toFixed(2)}</td></tr>`).join('');
      document.getElementById('shippingPreview').innerHTML = `<div class="preview-grid"><div class="pv"><div class="k">Warehouse</div><div class="v">${order.shipping.warehouse}</div></div><div class="pv"><div class="k">Carrier</div><div class="v">${order.shipping.carrier}</div></div><div class="pv full"><div class="k">Address</div><div class="v">${order.shipping.address}</div></div></div>`;
    }

    function bindEdit() {
      document.getElementById('orderNo').value = order.no;
      document.getElementById('customer').value = order.customer;
      document.getElementById('status').value = order.status;
      document.getElementById('amount').value = order.amount;
      document.getElementById('orderDate').value = order.date;
      document.getElementById('deliveryTime').value = order.deliveryTime;
      document.getElementById('appointment').value = order.appointment;
      document.getElementById('note').value = order.note;

      const eBody = document.getElementById('itemsEditBody');
      eBody.innerHTML = order.items.map(it => `<tr><td><input class="form-control form-control-sm" value="${it.product}"></td><td><input class="form-control form-control-sm" type="number" value="${it.qty}"></td><td><input class="form-control form-control-sm" type="number" step="0.01" value="${it.price}"></td><td>${(it.qty*it.price).toFixed(2)}</td></tr>`).join('');
    }

    let edit = false;
    document.getElementById('editToggle').onclick = () => {
      edit = !edit;
      const root = document.getElementById('detailRoot');
      root.classList.toggle('readonly', !edit);
      root.classList.toggle('edit-mode', edit);
      document.getElementById('modePill').textContent = edit ? 'Edit' : 'Preview';
      document.getElementById('editToggle').textContent = edit ? 'Preview' : 'Edit';
    };

    document.getElementById('themeToggle').onclick = () => {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
    };

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
      };
    });

    renderPreview();
    bindEdit();
  </script>
</body>
</html>
