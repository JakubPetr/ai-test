<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP Orders - List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #fff;
      --surface-2: #f0f3f8;
      --text: #17212e;
      --muted: #607086;
      --border: #d9e1ec;
      --accent: #0a6ed1;
    }
    html[data-theme="dark"] {
      --bg: #0f141b;
      --surface: #161d27;
      --surface-2: #1e2835;
      --text: #e4ebf5;
      --muted: #9bb0c7;
      --border: #2d3b4d;
      --accent: #4da3ff;
    }
    body { margin:0; font: 13px/1.3 "Inter", "Segoe UI", sans-serif; background: var(--bg); color:var(--text); }
    .topbar { height:48px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--border); }
    .brand { font-weight:700; margin-right:auto; }
    .panel { margin:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.08); display:grid; grid-template-rows:auto auto 1fr auto; min-height: calc(100vh - 68px); }
    .panel-head,.toolbar,.agg-row { padding:8px 10px; border-bottom:1px solid var(--border); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; font-weight:600; }
    .toolbar { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    .field{ display:grid; gap:3px; }
    label { font-size:11px; color:var(--muted); text-transform:uppercase; }
    input,select,button { min-height:30px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); padding:5px 7px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse: collapse; }
    th,td { padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { position: sticky; top:0; background:var(--surface); text-align:left; }
    tr:hover { background: var(--surface-2); }
    .status { padding:1px 6px; border-radius:12px; font-size:11px; }
    .open { background:#fff2df; color:#b65f00; }
    .closed { background:#e5f5eb; color:#1d8554; }
    .agg-row { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); color:var(--muted); background:var(--surface-2); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">ERP Compact UI · Order List</div>
    <button id="themeToggle">🌗 Theme</button>
  </header>

  <section class="panel">
    <div class="panel-head">
      <span>Orders</span>
      <small id="rowCount">0 rows</small>
    </div>

    <div class="toolbar">
      <div class="field"><label>Customer</label><input id="fCustomer" placeholder="contains..." /></div>
      <div class="field"><label>Status</label><select id="fStatus"><option value="">All</option><option>Open</option><option>Closed</option></select></div>
      <div class="field"><label>Min amount</label><input id="fMin" type="number" /></div>
      <div class="field"><label>Sort by</label><select id="fSort"><option value="date_desc">Date ↓</option><option value="date_asc">Date ↑</option><option value="amount_desc">Amount ↓</option><option value="amount_asc">Amount ↑</option></select></div>
    </div>

    <div class="table-wrap" id="listScroll">
      <table>
        <thead><tr><th>Order #</th><th>Date</th><th>Customer</th><th>Status</th><th>Amount</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>

    <div class="agg-row">
      <div><strong id="aggCount">0</strong> orders</div>
      <div><strong id="aggOpen">0</strong> open</div>
      <div><strong id="aggClosed">0</strong> closed</div>
      <div>Total: <strong id="aggAmount">0.00</strong></div>
    </div>
  </section>

  <script>
    const state = {allRows: [], filteredRows: [], page:0, pageSize:40};
    const listBody = document.getElementById('listBody');
    const listScroll = document.getElementById('listScroll');

    function generateRows(count = 500) {
      const customers = ['ACME Corp', 'Northwind', 'Globex', 'Initech', 'Umbrella', 'Soylent', 'Hooli'];
      return Array.from({length:count}, (_,i) => {
        const id = i + 1;
        const day = String((id % 28) + 1).padStart(2, '0');
        return {
          id,
          no: `SO-${String(id).padStart(5, '0')}`,
          date: `2026-03-${day}`,
          customer: customers[id % customers.length],
          status: id % 3 === 0 ? 'Closed' : 'Open',
          amount: +(Math.random() * 1900 + 100).toFixed(2)
        };
      });
    }

    function applyFilters() {
      const customer = document.getElementById('fCustomer').value.trim().toLowerCase();
      const status = document.getElementById('fStatus').value;
      const min = parseFloat(document.getElementById('fMin').value || '0');
      const sort = document.getElementById('fSort').value;
      state.filteredRows = state.allRows.filter(r => (!customer || r.customer.toLowerCase().includes(customer)) && (!status || r.status === status) && r.amount >= min);
      state.filteredRows.sort((a,b) => sort==='date_desc'?b.date.localeCompare(a.date):sort==='date_asc'?a.date.localeCompare(b.date):sort==='amount_desc'?b.amount-a.amount:a.amount-b.amount);
      state.page = 0;
      listBody.innerHTML = '';
      renderNextPage();
      updateAgg();
    }

    function renderNextPage() {
      const start = state.page * state.pageSize;
      const next = state.filteredRows.slice(start, start + state.pageSize);
      next.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><a href="detail.html?id=${r.id}">${r.no}</a></td><td>${r.date}</td><td>${r.customer}</td><td><span class="status ${r.status==='Open'?'open':'closed'}">${r.status}</span></td><td>${r.amount.toFixed(2)}</td>`;
        listBody.appendChild(tr);
      });
      state.page++;
      document.getElementById('rowCount').textContent = `${state.filteredRows.length} rows`;
    }

    function updateAgg() {
      const count = state.filteredRows.length;
      const open = state.filteredRows.filter(r => r.status === 'Open').length;
      const total = state.filteredRows.reduce((sum, r) => sum + r.amount, 0);
      document.getElementById('aggCount').textContent = count;
      document.getElementById('aggOpen').textContent = open;
      document.getElementById('aggClosed').textContent = count - open;
      document.getElementById('aggAmount').textContent = total.toFixed(2);
    }

    document.getElementById('themeToggle').onclick = () => {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
    };

    ['fCustomer','fStatus','fMin','fSort'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', applyFilters);
      el.addEventListener('change', applyFilters);
    });

    listScroll.addEventListener('scroll', () => {
      const nearBottom = listScroll.scrollTop + listScroll.clientHeight >= listScroll.scrollHeight - 40;
      if (nearBottom && state.page * state.pageSize < state.filteredRows.length) renderNextPage();
    });

    state.allRows = generateRows();
    applyFilters();
  </script>
</body>
</html>
